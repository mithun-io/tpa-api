services:

  # ─────────────── Infrastructure ───────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: tpa-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tpa-network
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: tpa-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tpa-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: tpa-kafka
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tpa-network
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ─────────────── Backend ──────────────────────────────────────────────────

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tpa-backend-api:latest
    container_name: tpa-backend
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Allows the container to access localhost (the host machine) on host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=docker
      
      # Database (Connecting to Local Host)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/tpa}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      
      # Redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      
      # Security / JWT
      - JWT_SECRET=${JWT_SECRET:-super-secret-default-key-for-jwt-do-not-use-in-prod}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      
      # Admin Credentials (Seeding)
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tpa.com}
      - ADMIN_MOBILE=${ADMIN_MOBILE:-+1 415-859-2671}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Qw3!@sPe:E1}
      
      # AI & 3rd Party Integrations
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAZORPAY_KEY=${RAZORPAY_KEY:-}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET:-}
      
      # Mail Configuration (Optional)
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - tpa-network
    volumes:
      - tpa_uploads:/app/uploads

# ─────────────── Shared ───────────────────────────────────────────────────

networks:
  tpa-network:
    driver: bridge

volumes:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  tpa_uploads:
